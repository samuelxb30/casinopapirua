<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MemeX · Paper Crypto Exchange</title>
<style>
:root{--bg:#0b0e17;--card:#141a2b;--line:#252d45;--gold:#f5c542;--txt:#e8ecf7;--mut:#8b94b3;--g:#2ecc71;--r:#ff5370}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2342,var(--bg));color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:#0d1120cc;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:var(--gold)}.logo small{color:var(--mut);font-weight:500;font-size:11px;display:block;letter-spacing:2px}
.me{display:flex;align-items:center;gap:14px}
.bal{background:#0b0e17;border:1px solid var(--gold);color:var(--gold);padding:7px 16px;border-radius:99px;font-weight:700}
.btn{background:var(--gold);color:#1a1300;border:0;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.buy{background:var(--g);color:#06210f}.btn.sell{background:var(--r);color:#2a0710}
.wrap{max-width:1250px;margin:auto;padding:18px 24px 50px;display:grid;grid-template-columns:260px 1fr 290px;gap:16px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.coin{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.coin:hover{background:#1b2340}.coin.on{background:#1b2340;border-color:var(--gold)}
.coin .e{font-size:24px;width:32px;text-align:center}.coin .s{font-weight:700}.coin .n{font-size:11px;color:var(--mut)}
.coin .p{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}.up{color:var(--g)}.dn{color:var(--r)}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.price{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px}.seg button{background:#0b0e17;color:var(--mut);border:1px solid var(--line);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
#chart{width:100%;height:380px;display:block;cursor:crosshair}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}
input{background:#0b0e17;border:1px solid var(--line);color:var(--txt);padding:11px 12px;border-radius:9px;font-size:16px;width:100%}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.quick button{padding:7px 0;font-size:12px}
.est{color:var(--mut);margin:12px 0;min-height:36px}.est b{color:var(--txt)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.full{grid-column:1/-1;overflow-x:auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222a46;border:1px solid var(--gold);padding:12px 22px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.tr{padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}.tr:hover{background:#1b2340}.tr .m{font-size:12px;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:10px;grid-column:1/-1}
</style></head><body>
<header>
  <div class="logo">📈 MemeX Exchange<small>PAPER CRYPTO · NO REAL MONEY</small></div>
  <div class="me"><a class="btn ghost" href="/" style="text-decoration:none">← Casino</a><span id="who" style="color:var(--mut)"></span><div class="bal">🪙 <span id="bal">0</span></div></div>
</header>

<div class="wrap">
  <div><div class="card" id="list"></div><div class="card" id="feed" style="margin-top:16px"></div></div>

  <div class="card">
    <div class="top">
      <div><div style="color:var(--mut)" id="cname"></div><div class="price" id="cprice">—</div><div id="cchg"></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="seg" id="ctype"><button data-v="line" class="on">Line</button><button data-v="candle">Candles</button></div>
        <div class="seg" id="ctf"><button data-v="60">1m</button><button data-v="180" class="on">3m</button><button data-v="600">10m</button></div>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <div class="tabs"><button class="btn buy" id="tbuy" onclick="setSide('buy')">Buy</button><button class="btn ghost" id="tsell" onclick="setSide('sell')">Sell</button></div>
    <label id="albl">Amount (coins)</label>
    <input id="amt" type="number" min="1" value="100" oninput="est()">
    <div class="quick" id="quick"></div>
    <div class="est" id="est"></div>
    <button class="btn buy" id="go" style="width:100%" onclick="trade()">Buy</button>
    <div style="color:var(--mut);font-size:12px;margin-top:10px">Fee: 0.5% per trade · Prices move live for everyone.</div>
  </div>

  <div class="card full">
    <b>Your portfolio</b>
    <table><thead><tr><th>Asset</th><th>Quantity</th><th>Avg cost</th><th>Price</th><th>Value</th><th>P&amp;L</th><th></th></tr></thead><tbody id="pf"></tbody></table>
    <div id="pfsum" style="margin-top:10px;color:var(--mut)"></div>
  </div>
  <div class="foot">Simulated market with virtual currency. Not financial advice, and no cash value.</div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), token=localStorage.token;
if(!token)location='/';
let me='',sel='DOGO',side='buy',type='line',tf=180,M=null,mouse=null,busy=false;
const fmt=n=>Math.floor(n).toLocaleString();
const fp=p=>p>=1000?p.toLocaleString(undefined,{maximumFractionDigits:2}):p>=1?p.toFixed(3):p>=.01?p.toFixed(4):p.toFixed(6);
const pc=c=>(c>=0?'+':'')+(c*100).toFixed(2)+'%';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2400)}
async function api(p,b){try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:token},body:b?JSON.stringify(b):undefined});
  const d=await r.json();if(r.status===401){localStorage.removeItem('token');location='/';return null}if(!r.ok){toast(d.error||'Error');return null}return d}catch(e){return null}}

async function load(){
  const d=await api('market?coin='+sel);if(!d)return;M=d;
  $('#bal').textContent=fmt(d.balance);
  $('#list').innerHTML='<b style="display:block;margin-bottom:8px">Markets</b>'+d.coins.map(c=>`<div class="coin ${c.sym===sel?'on':''}" onclick="pick('${c.sym}')"><div class="e">${c.emoji}</div><div><div class="s">${c.sym}</div><div class="n">${c.name}</div></div><div class="p"><div>${fp(c.price)}</div><div class="${c.change>=0?'up':'dn'}">${pc(c.change)}</div></div></div>`).join('');
  $('#feed').innerHTML='<b style="display:block;margin-bottom:8px">Live trades</b><div style="max-height:340px;overflow-y:auto">'+(d.feed.map(t=>{const c=d.coins.find(x=>x.sym===t.sym),ago=d.tick-t.tick;
    return `<div class="tr" onclick="pick('${t.sym}')"><div><b>${t.user}</b> <span class="${t.side==='buy'?'up':'dn'}">${t.side==='buy'?'bought':'sold'}</span> ${c.emoji} ${t.sym}</div><div class="m">${fmt(t.coins)} coins @ ${fp(t.price)} · ${ago<60?ago+'s':Math.floor(ago/60)+'m'} ago</div></div>`}).join('')||'<div style="color:var(--mut)">No trades yet.</div>')+'</div>';
  const cur=d.coins.find(c=>c.sym===sel),h=d.history,start=h[Math.max(0,h.length-tf)];
  $('#cname').textContent=cur.emoji+' '+cur.name+' ('+cur.sym+')';$('#cprice').textContent=fp(cur.price);
  const ch=cur.price/start-1;$('#cchg').innerHTML=`<span class="${ch>=0?'up':'dn'}">${pc(ch)}</span> <span style="color:var(--mut)">over selected range</span>`;
  draw();est();portfolio();
}
function pick(s){sel=s;load()}

// ---------- custom canvas chart ----------
function draw(){
  if(!M)return;const cv=$('#chart'),ctx=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight,dpr=devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const d=M.history.slice(-tf),n=d.length,PR=74,PB=24,PT=10,cw=W-PR,ch=H-PB-PT;
  let pts,g=1;                                           // series of {o,h,l,c}
  if(type==='candle'){g=Math.max(1,Math.ceil(n/60));pts=[];for(let i=0;i<n;i+=g){const s=d.slice(i,i+g);pts.push({o:s[0],h:Math.max(...s),l:Math.min(...s),c:s[s.length-1]})}}
  else pts=d.map(v=>({o:v,h:v,l:v,c:v}));
  let lo=Math.min(...pts.map(p=>p.l)),hi=Math.max(...pts.map(p=>p.h));const pad=(hi-lo)*.08||hi*.001;lo-=pad;hi+=pad;
  const X=i=>(i+.5)/pts.length*cw,Y=v=>PT+(1-(v-lo)/(hi-lo))*ch;
  ctx.font='11px system-ui';ctx.textBaseline='middle';
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,y=Y(v);ctx.strokeStyle='#252d4588';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();ctx.fillStyle='#8b94b3';ctx.textAlign='left';ctx.fillText(fp(v),cw+8,y)}
  ctx.textAlign='center';for(let i=0;i<=4;i++){const s=Math.round((n)*(1-i/4));ctx.fillText(i===4?'now':'-'+s+'s',i===4?cw-14:Math.max(18,cw*i/4),H-9)}
  const up=pts[pts.length-1].c>=pts[0].o,col=up?'#2ecc71':'#ff5370';
  if(type==='line'){
    const gr=ctx.createLinearGradient(0,PT,0,PT+ch);gr.addColorStop(0,up?'#2ecc7144':'#ff537044');gr.addColorStop(1,'#0000');
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(i),Y(p.c)):ctx.moveTo(X(i),Y(p.c)));ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
    ctx.lineTo(X(pts.length-1),PT+ch);ctx.lineTo(X(0),PT+ch);ctx.fillStyle=gr;ctx.fill();
  }else{
    const w=Math.max(2,cw/pts.length*.7);
    pts.forEach((p,i)=>{const c=p.c>=p.o?'#2ecc71':'#ff5370',x=X(i);ctx.strokeStyle=ctx.fillStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,Y(p.h));ctx.lineTo(x,Y(p.l));ctx.stroke();
      ctx.fillRect(x-w/2,Math.min(Y(p.o),Y(p.c)),w,Math.max(1,Math.abs(Y(p.o)-Y(p.c))))});
  }
  // average cost line if user holds this coin
  const hold=M.holdings.find(h=>h.sym===sel);
  if(hold&&hold.qty>0){const a=hold.cost/hold.qty;if(a>lo&&a<hi){ctx.setLineDash([5,5]);ctx.strokeStyle='#f5c542';ctx.beginPath();ctx.moveTo(0,Y(a));ctx.lineTo(cw,Y(a));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f5c542';ctx.textAlign='left';ctx.fillText('avg '+fp(a),6,Y(a)-8)}}
  // trade markers: dot at the exact price/time, name label attached
  const placed=[],base=M.history.length-n;ctx.font='bold 11px system-ui';
  M.marks.forEach(t=>{const idx=M.history.length-1-(M.tick-t.tick)-base;if(idx<0||idx>=n)return;
    const x=X(type==='candle'?Math.floor(idx/g):idx),y=Y(t.price),buy=t.side==='buy',mine=t.user===me,col=buy?'#2ecc71':'#ff5370';
    const txt=t.user+' · '+(buy?'+':'-')+fmt(t.coins),w=ctx.measureText(txt).width+12,dir=buy?-1:1;
    let lx=Math.min(Math.max(2,x-w/2),cw-w-2),ly=Math.max(PT,Math.min(PT+ch-18,buy?y-34:y+16)),k=0;
    while(placed.some(r=>lx<r.x+r.w&&lx+w>r.x&&ly<r.y+18&&ly+18>r.y)&&k++<8)ly=Math.max(PT,Math.min(PT+ch-18,ly+dir*20));
    placed.push({x:lx,y:ly,w});
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,ly+(ly<y?18:0));ctx.stroke();
    ctx.fillStyle='#10162a';ctx.fillRect(lx,ly,w,18);ctx.strokeStyle=mine?'#f5c542':col;ctx.lineWidth=mine?2:1;ctx.strokeRect(lx,ly,w,18);
    ctx.fillStyle=col;ctx.textAlign='left';ctx.fillText(txt,lx+6,ly+9);
    ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()});
  ctx.font='11px system-ui';
  // last price tag
  const last=pts[pts.length-1].c,ly=Y(last);ctx.setLineDash([2,3]);ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(cw,ly);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col;ctx.fillRect(cw,ly-10,PR,20);ctx.fillStyle='#06100a';ctx.textAlign='left';ctx.font='bold 11px system-ui';ctx.fillText(fp(last),cw+6,ly);
  // crosshair
  if(mouse&&mouse.x<cw){const i=Math.min(pts.length-1,Math.max(0,Math.floor(mouse.x/cw*pts.length))),p=pts[i];
    ctx.strokeStyle='#8b94b3';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(X(i),PT);ctx.lineTo(X(i),PT+ch);ctx.moveTo(0,mouse.y);ctx.lineTo(cw,mouse.y);ctx.stroke();ctx.setLineDash([]);
    const txt=type==='candle'?`O ${fp(p.o)}  H ${fp(p.h)}  L ${fp(p.l)}  C ${fp(p.c)}`:fp(p.c);ctx.font='12px system-ui';const tw=ctx.measureText(txt).width+16,tx=Math.min(Math.max(4,X(i)-tw/2),cw-tw);
    ctx.fillStyle='#222a46';ctx.fillRect(tx,PT+4,tw,22);ctx.fillStyle='#e8ecf7';ctx.textAlign='left';ctx.fillText(txt,tx+8,PT+15);
    ctx.fillStyle='#222a46';ctx.fillRect(cw,mouse.y-10,PR,20);ctx.fillStyle='#e8ecf7';ctx.fillText(fp(lo+(1-(mouse.y-PT)/ch)*(hi-lo)),cw+6,mouse.y)}
}
const cv=$('#chart');
cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top};draw()};
cv.onmouseleave=()=>{mouse=null;draw()};
document.querySelectorAll('#ctype button').forEach(b=>b.onclick=()=>{type=b.dataset.v;document.querySelectorAll('#ctype button').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.querySelectorAll('#ctf button').forEach(b=>b.onclick=()=>{tf=+b.dataset.v;document.querySelectorAll('#ctf button').forEach(x=>x.classList.toggle('on',x===b));load()});
addEventListener('resize',draw);

// ---------- trading ----------
function setSide(s){side=s;$('#tbuy').className='btn '+(s==='buy'?'buy':'ghost');$('#tsell').className='btn '+(s==='sell'?'sell':'ghost');
  $('#go').className='btn '+s;$('#go').textContent=(s==='buy'?'Buy ':'Sell ')+sel;$('#albl').textContent=s==='buy'?'Amount (coins)':'Percent of holding (%)';
  $('#amt').value=s==='buy'?100:100;
  $('#quick').innerHTML=(s==='buy'?[['10%',.1],['25%',.25],['50%',.5],['Max',1]]:[['25%',25],['50%',50],['75%',75],['100%',100]]).map(q=>`<button class="btn ghost" onclick="quick(${q[1]})">${q[0]}</button>`).join('');est()}
function quick(v){$('#amt').value=side==='buy'?Math.floor(M.balance*v):v;est()}
function est(){if(!M)return;$('#go').textContent=(side==='buy'?'Buy ':'Sell ')+sel;const c=M.coins.find(x=>x.sym===sel),v=parseFloat($('#amt').value)||0;
  if(side==='buy')$('#est').innerHTML=`You get ≈ <b>${(v*(1-M.fee)/c.price).toPrecision(5)} ${sel}</b>`;
  else{const h=M.holdings.find(x=>x.sym===sel),q=h?h.qty*Math.min(v,100)/100:0;$('#est').innerHTML=h?`Sell <b>${q.toPrecision(5)} ${sel}</b> for ≈ <b>${fmt(q*c.price*(1-M.fee))} coins</b>`:'You don’t own this coin.'}}
async function trade(){if(busy)return;busy=true;const v=parseFloat($('#amt').value)||0;
  const d=await api('trade',side==='buy'?{sym:sel,side,amount:Math.floor(v)}:{sym:sel,side,percent:v});busy=false;if(d){toast(d.msg);load()}}
async function sellAll(s){busy=true;const d=await api('trade',{sym:s,side:'sell',percent:100});busy=false;if(d){toast(d.msg);load()}}

function portfolio(){let tv=0,tc=0;
  $('#pf').innerHTML=M.holdings.map(h=>{const c=M.coins.find(x=>x.sym===h.sym),val=h.qty*c.price,pnl=val-h.cost;tv+=val;tc+=h.cost;
    return `<tr><td onclick="pick('${h.sym}')" style="cursor:pointer">${c.emoji} <b>${h.sym}</b></td><td>${h.qty.toPrecision(5)}</td><td>${fp(h.cost/h.qty)}</td><td>${fp(c.price)}</td><td>${fmt(val)}</td>
    <td class="${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${fmt(pnl)} (${pc(pnl/h.cost)})</td><td><button class="btn sell" style="padding:6px 12px" onclick="sellAll('${h.sym}')">Sell all</button></td></tr>`}).join('')
    ||'<tr><td colspan="7" style="color:var(--mut)">No holdings yet — buy a coin to get started.</td></tr>';
  $('#pfsum').innerHTML=M.holdings.length?`Portfolio value <b style="color:var(--txt)">${fmt(tv)}</b> · Total P&amp;L <b class="${tv>=tc?'up':'dn'}">${tv>=tc?'+':''}${fmt(tv-tc)}</b> · Net worth <b style="color:var(--gold)">${fmt(M.balance+tv)}</b>`:''}

api('me').then(d=>{if(d){me=d.username;$('#who').textContent=d.username}});
setSide('buy');load();setInterval(load,1000);
</script></body></html>
